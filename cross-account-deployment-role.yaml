AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cross-account role for deploying Cost Anomaly Detective from a trusted account'

Parameters:
  TrustedAccountId:
    Type: String
    Default: '123456789012'
    Description: AWS account ID that can assume this role (replace with your management account ID)

Resources:
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CostDetectiveDeploymentRole
      Description: Allows deployment of Cost Anomaly Detective from trusted account
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${TrustedAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: 'cost-detective-deploy-2026'
      Policies:
        - PolicyName: CloudFormationDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudFormation
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource: !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/cost-detective*/*'

              # Lambda
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                Resource: !Sub 'arn:aws:lambda:*:${AWS::AccountId}:function:cost-detective*'

              # IAM (scoped to cost-detective resources)
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cost-detective*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/CostDetective*'

              # DynamoDB
              - Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateContinuousBackups
                Resource: !Sub 'arn:aws:dynamodb:*:${AWS::AccountId}:table/cost-anomalies*'

              # S3
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:PutBucketEncryption
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutLifecycleConfiguration
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:aws:s3:::cost-detective-reports-${AWS::AccountId}'

              # SNS
              - Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:SetTopicAttributes
                  - sns:GetTopicAttributes
                Resource: !Sub 'arn:aws:sns:*:${AWS::AccountId}:*cost-anomaly*'

              # EventBridge
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub 'arn:aws:events:*:${AWS::AccountId}:rule/*cost-detective*'

              # Secrets Manager
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:*:${AWS::AccountId}:secret:cost-detective*'
      MaxSessionDuration: 3600

Outputs:
  RoleArn:
    Description: ARN of the deployment role to assume
    Value: !GetAtt DeploymentRole.Arn
    Export:
      Name: CostDetectiveDeploymentRoleArn

  AssumeRoleCommand:
    Description: Command to assume this role from the trusted account
    Value: !Sub |
      aws sts assume-role \
        --role-arn ${DeploymentRole.Arn} \
        --role-session-name cost-detective-deployment \
        --external-id cost-detective-deploy-2026
